#server:
#  port: 1157
spring:
#  application:
#    name: ${HOSTNAME:@hertzbeat@}${PID}
#  profiles:
#    active: prod
  boot:
    admin:
      notify:
        mail:
          enabled: false
  mvc:
    static-path-pattern: /**
  jackson:
    default-property-inclusion: ALWAYS
  web:
    resources:
      static-locations:
        - classpath:/dist/
        - classpath:../dist/
  # need to disable spring boot mongodb auto config, or default mongodb connection tried and failed.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration, org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
  freemarker:
    enabled: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
#mybatis:
#  mapper-locations: classpath*:mapper/*.xml

  # 或指定具体路径
  # mapper-locations: classpath:/mapper/UserMapper.xml
management:
  health:
    mail:
      enabled: off
  endpoints:
    web:
      exposure:
        include:
          - 'metrics'
          - 'health'
          - 'prometheus'
    enabled-by-default: on
# Pig OAuth2 资源服务器 - 放行的 URL
security:
  oauth2:
    ignore:
      urls:
        # HertzBeat 公开接口
        - /api/account/auth/form
        - /api/account/auth/refresh
        - /api/alerts/report/**
        - /api/alert/sse/**
        - /api/i18n/**
        - /api/apps/hierarchy
        - /api/push/**
        - /api/status/page/public/**
        - /api/manager/sse/**
        - /api/monitorMetrics/**
        - /api/alertHistory/**
        # HertzBeat 前端静态资源
        - /assets/**
        - /*.html
        - /*.js
        - /*.css
        - /*.ico
        - /*.png
        - /*.gif
        - /*.jpg
        - /*.svg
        - /*.json
        - /*.woff
        - /*.ttf
        - /*.eot
        # Swagger
        - /swagger-ui/**
        - /swagger-ui.html
        - /v3/api-docs/**
        - /swagger-resources/**

otel:
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none

---
spring:
#  config:
#    activate:
#      on-profile: prod
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    url: jdbc:postgresql://127.0.0.1:5432/pig-ai
    hikari:
      max-lifetime: 120000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password:
      database: 0

  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations:
      - classpath:db/migration/postgresql

  # Not Require, Please config if you need email notify
  # 非必填：不使用邮箱作为警告通知可以去掉spring.mail配置
  mail:
    # Mail server address, eg: qq-mailbox is smtp.qq.com, qq-exmail is smtp.exmail.qq.com
    host: smtp.qq.com
    username: 280545735@qq.com
    # Attention this is not email account password, this requires an email authorization code
    password: mmrjoujswixibgce
    # Mailbox smtp server port, eg: qq-mailbox is 465, qq-exmail is 587
    port: 465
    properties:
      mail:
        smtp:
          socketFactoryClass: javax.net.ssl.SSLSocketFactory
          ssl:
            enable: true
          starttls:
            enable: false
common:
  queue:
    # memory or kafka
    type: memory
    # properties when queue type is kafka
    kafka:
      servers: 127.0.0.1:9092
      metrics-data-topic: async-metrics-data
      service-discovery-data-topic: service-discovery-data
      alerts-data-topic: async-alerts-data

warehouse:
  store:
    # store history metrics data, enable only one below
    # 存储历史数据方式, 下方只能enabled启用一种方式
    jpa:
      enabled: true
      # The maximum retention time for history records, after which records will be deleted
      expire-time: 1h
    victoria-metrics:
      # Standalone mode toggle — must be set to false when using cluster mode
      enabled: false
      url: http://localhost:8428
      username: root
      password: root
      insert:
        buffer-size: 1000
        flush-interval: 3
      cluster:
        enabled: false
        select:
          url: http://localhost:8481
          username: root
          password: root
        insert:
          url: http://localhost:8480
          username: root
          password: root
          buffer-size: 1000
          flush-interval: 3
    td-engine:
      enabled: false
      driver-class-name: com.taosdata.jdbc.rs.RestfulDriver
      url: jdbc:TAOS-RS://localhost:6041/hertzbeat
      username: root
      password: taosdata
    greptime:
      enabled: false
      grpc-endpoints: localhost:4001
      http-endpoint: http://localhost:4000
      # if you config other database name, you should create them first
      database: public
      username: greptime
      password: greptime
    iot-db:
      enabled: false
      host: 127.0.0.1
      rpc-port: 6667
      username: root
      password: root
      query-timeout-in-ms: -1
      # data expire time, unit:ms, default '7776000000'(90 days, -1:never expire)
      expire-time: '7776000000'
    influxdb:
      enabled: false
      server-url: http://127.0.0.1:8086
      username: root
      password: root
      expire-time: '30d'
      replication: 1
  # store real-time metrics data, enable only one below
  real-time:
    memory:
      enabled: true
      init-size: 16
    redis:
      enabled: false
      # redis mode: single, sentinel, cluster. Default is single
      mode: single
      # separate each address with comma when using cluster mode, eg: 127.0.0.1:6379,127.0.0.1:6380
      address: 127.0.0.1:6379
      # enter master name when using sentinel mode
      masterName: mymaster
      password: 123456
      # redis db index, default: DB0
      db: 0

